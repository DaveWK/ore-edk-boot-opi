name: Release images

# Build the three boot-chain images (make r2s, make rv2, make rv2-nor) for a
# release tag and attach them to that tag's GitHub release. Builds run on a
# private self-hosted Fedora 44 runner; no Ubuntu-hosted runners are used.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'DaveWK/ore-edk-boot-opi'
    runs-on: [self-hosted, linux, x64, fedora44]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [r2s, rv2, rv2-nor]
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Require a Fedora 44 runner
        run: |
          . /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 44
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check build tools
        run: |
          for t in riscv64-linux-gnu-gcc gcc make python3 cpp dtc fdtput mkimage cargo rustup; do
            command -v "$t" >/dev/null || { echo "missing tool on the runner: $t" >&2; exit 1; }
          done
          command -v llvm-objcopy >/dev/null || command -v rust-objcopy >/dev/null ||
            { echo "missing tool on the runner: llvm-objcopy or rust-objcopy" >&2; exit 1; }
      - name: Fetch pinned submodules
        run: make submodules
      - name: Build ${{ matrix.image }}
        run: make "$IMAGE"
      - name: Name the release assets
        run: |
          mkdir -p dist
          for f in out/"$IMAGE"/*; do
            case "$(basename "$f")" in SHA256SUMS) continue ;; esac
            cp "$f" "dist/$IMAGE-$(basename "$f")"
          done
          (cd dist && sha256sum -- * > "$IMAGE-SHA256SUMS" && cat "$IMAGE-SHA256SUMS")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; Node 24
        with:
          name: image-${{ matrix.image }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.repository == 'DaveWK/ore-edk-boot-opi'
    runs-on: [self-hosted, linux, x64, fedora44]
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Require a Fedora 44 runner
        run: |
          . /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 44
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1; Node 24
        with:
          pattern: image-*
          path: dist/
          merge-multiple: true
      - name: Verify and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          for sums in *-SHA256SUMS; do sha256sum -c "$sums"; done
          cat *-SHA256SUMS > SHA256SUMS
          {
            printf 'Boot-chain images for %s: oreboot bt0 -> OpenSBI -> EDK2 (no U-Boot).\n\n' "$TAG"
            printf -- '- r2s: bt0.bin to eMMC boot0 at 512; next.img to eMMC boot1\n'
            printf -- '- rv2: bt0.bin to the microSD FSBL copies; next.img to the GPT partition "boot1"\n'
            printf -- '- rv2-nor: bt0.bin to NOR 0x20000 and 0x70000; next.itb to NOR 0xa0000\n\n'
            printf 'See README.md for install steps. Checksums in SHA256SUMS.\n'
          } > ../notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" -- * --clobber
          else
            gh release create "$TAG" -- * --verify-tag --title "$TAG" --notes-file ../notes.txt
          fi
