# OrangePi RV2: SpacemiT K1 (Ky X1), 4 GiB LPDDR4X single rank, microSD + eMMC socket + NVMe
EDK2_PLATFORM=OrangePiPkg/K1/RV2/RV2.dsc
EDK2_FD=ORANGEPI-RV2.fd
DTS=spacemit/k1-orangepi-rv2.dts
CS_NUM=1
# 4 GiB: 2 GiB at 0 and 2 GiB at 0x1_0000_0000; one memory node each, as EDK2
# SEC parses one reg pair per node
MEMORY="0x0:0x80000000 0x100000000:0x80000000"
# bt0 reads the OpenSBI + EDK2 FIT from raw microSD sectors: the 4 MiB GPT
# partition "uboot" (p2) at LBA 8192 in the RV2's SD layout. The BootROM
# loads bt0 itself from the FSBL copies at 128 KiB and 512 KiB.
BT0_BOOT=sd
NEXT_LBA=8192
# The M.2 slot's 3.3 V (vpcie3v3) is switched by GPIO 116; bt0 turns it on so
# EDK2 finds the NVMe link.
PCIE_PWR_GPIO=116
NEXT_STAGE_MAX=4194304
