# OrangePi RV2 booting entirely from its 16 MiB SPI NOR (BootROM boots the NOR
# when the microSD card is absent or not bootable).
#   0x000000  BootROM header (keep the existing one)
#   0x020000  bt0 (bt0.bin); second copy at 0x070000
#   0x0a0000  next.itb: EDK2 lands at 0x0a1000, so its variable store is at
#             0x2a0000-0x360000 (shared with the microSD build)
# UEFI variables in the NOR, next to the firmware itself.
UEFI_VARS=nor
NOR_VARS_OK=yes
EDK2_PLATFORM=OrangePiPkg/K1/RV2/RV2.dsc
EDK2_FD=ORANGEPI-RV2.fd
DTS=spacemit/k1-orangepi-rv2.dts
CS_NUM=1
MEMORY="0x0:0x80000000 0x100000000:0x80000000"
BT0_BOOT=nor
# 0xa0000 / 512
NEXT_LBA=1280
PCIE_PWR_GPIO=116
# up to the end of the 0xa0000-0x800000 area
NEXT_STAGE_MAX=7733248
