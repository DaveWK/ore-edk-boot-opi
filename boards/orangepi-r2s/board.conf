# OrangePi R2S: SpacemiT K1 (Ky X1), 2 GiB LPDDR4X single rank, eMMC only
EDK2_PLATFORM=OrangePiPkg/K1/R2S/R2S.dsc
EDK2_FD=ORANGEPI-R2S.fd
DTS=spacemit/k1-orangepi-r2s.dts
CS_NUM=1
# RAM ranges (base:size); one memory node each, as EDK2 SEC parses one
# reg pair per node (U-Boot normally adds these)
MEMORY="0x0:0x80000000"
# bt0 reads the OpenSBI + EDK2 FIT from eMMC hardware partition boot1 (4 MiB)
BT0_BOOT=emmc
NEXT_LBA=0
PCIE_PWR_GPIO=0
NEXT_STAGE_MAX=4194304
